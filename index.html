<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Valentine 💖</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background-image: url("kaaku.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: "Segoe UI", Arial, sans-serif;
      color: white;
      text-align: center;
    }

    /* Dark overlay for readability */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: -1;
    }

    .container {
      max-width: 90%;
    }

    h1 {
      font-size: clamp(24px, 5vw, 40px);
      margin-bottom: 30px;
      text-shadow: 2px 2px 6px black;
    }

    .buttons {
      position: relative;
      height: 120px;
    }

    button {
      padding: 14px 30px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #cccccc;
      position: absolute;
      left: 140px;
    }

    button:hover {
      transform: scale(1.05);
    }

    img {
      max-width: 280px;
      border-radius: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="overlay"></div>

  <div class="container" id="content">
    <h1>Hi Kaakuu, will you be my Valentine? ❤️</h1>

    <div class="buttons">
      <button id="yes">YES</button>
      <button id="no">NO</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");

    noBtn.addEventListener("mouseover", () => {
      const maxX = window.innerWidth - noBtn.offsetWidth - 20;
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    document.getElementById("yes").addEventListener("click", () => {
      document.getElementById("content").innerHTML = `
        <h1>💖 YAY!!! 💖</h1>
        <p style="font-size:20px;">Best decision ever 😘</p>
        <img src="https://media1.tenor.com/m/6oVpxIFwAAoAAAAC/cat-kiss.gif" />
        <p style="font-size:18px;">I love you ❤️</p>
      `;
    });
  </script>
</body>
</html>
